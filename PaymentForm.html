<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/all.min.css">
    <link rel="stylesheet" href="assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <title>Challan</title>
</head>
<body id="PaymentFormBody">

     <div class="container-fluid p-4">
        <div class="row challan-card-hol">
            <div class="col-12 col-sm-12 col-md-12 col-lg-12 col-xl-12 col-xxl-12">
                <div class="card">
                    <div class="card-body">
                        <div class="row">
                            <div class="col-12 col-sm-12 col-md-4 col-lg-4 col-xl-4 col-xxl-4">
                                <img class="logo-img" src="assets/images/logo-img.png" alt="#">

                            </div><!---End of frstcard-->
                             <div class="col-12 col-sm-12 col-md-4 col-lg-4 col-xl-4 col-xxl-4 d-flex flex-column align-items-center">
                                <h2 class="fw-bold text-center">PUNJAB TRAFFIC POLICE</h2>
                                <h4 class="fw-bold">Traffic Challan</h4>

                                <p class="text-muted">Safe Roads, Save Lives</p>
                                <h4 class="text-danger text-center pay-prompt"></h4>
                            
                            </div><!---End of second card-->
                            <div class="col-12 col-sm-12 col-md-4 col-lg-4 col-xl-4 col-xxl-4 d-flex justify-content-center justify-content-lg-end">
                                <img class="logo-img" src="assets/images/barcode-image.png" alt="#">

                            </div><!---End of thrdcard-->
                        </div><!---End of row-->
                        <div class="row g-3 mt-5 challan-card-hol">
                           
                               <!-- table sec -->
                                <div class="col-12 col-sm-12 col-md-12 col-lg-12 col-xl-12 col-xxl-12">
                                    <form action="#">
                                        <div class="row">
                                            <div class="col-12 col-sm-12 col-md-6 col-lg-6 col-xl-6 col-xxl-6">
                                                <div class="mb-3">
                                    <label for="chllanNM" class="form-label">Challan Number</label>
                                    <input type="text" class="form-control" id="chllanNM" placeholder="Enter challan Num ....">
                                    </div>

                                            </div>
                                        <!-- 2 -->
                                          <div class="col-12 col-sm-12 col-md-6 col-lg-6 col-xl-6 col-xxl-6">
                                                <div class="mb-3">
                                    <label for="fineAmount" class="form-label">Fine Amount</label>
                                    <input type="text" class="form-control" id="fineAmount" placeholder="Enter Fine amount ....">
                                    </div>

                                            </div>
                                            <!-- 3 -->
                                              <div class="col-12 col-sm-12 col-md-6 col-lg-6 col-xl-6 col-xxl-6">
                                                <div class="mb-3">
                                    <label for="PaymentMethod" class="form-label">Select Payment Method</label>
                                    <select class="form-select" id="PaymentMethod">
                                  <option value="Cash">Cash</option>
                                  <option value="Bank">Bank</option>
                                  <option value="ATM">ATM</option>
                                  <option value="OnlineBanking">Online Banking</option>
                                  <option value="EasyPaisa">Easy Paisa</option>
                                  <option value="JazzCash">JazzCash</option>
                                  <option value="ePay">ePay</option>
                                </select>

                                            </div>
                                        </div>
                                        <!-- 4 -->
                                           <div class="col-12 col-sm-12 col-md-6 col-lg-6 col-xl-6 col-xxl-6">
                                                <div class="mb-3">
                                    <label for="transactionId" class="form-label">Transaction ID</label>
                                    <input type="text" class="form-control" id="transactionId" placeholder="Enter Transaction ID ....">
                                    </div>

                                            </div>
                                            <!-- 5-->
                                           <div class="col-12 col-sm-12 col-md-6 col-lg-6 col-xl-6 col-xxl-6">
                                                <div class="mb-3">
                                    <label for="paymentDate" class="form-label">Payment Date</label>
                                    <input type="date" class="form-control" id="paymentDate" >
                                    </div>

                                            </div>
                                            </div>
                                            <div class="d-flex justify-content-center mt-5">
                                            <button type="submit" class="btn pay-btn">Pay</button>
                                            </div>
                                           
                                    </form>
                                </div>
                                

                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="d-flex justify-content-center justify-content-lg-end p-4">
   <button class="text-light backBtn btn h-25 py-2 "> <a href="Payments.html" class="text-decoration-none text-light">Back</a> </button>
   </div>
     </div>
      
 


    <script src="assets/css/bootstrap.bundle.min.js"></script>
</body>
<script src="assets/css/Script.js"></script>
</html>
